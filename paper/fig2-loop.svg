<svg xmlns="http://www.w3.org/2000/svg" class="flow" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 800 280" role="img" aria-label="The feedback loop during one agent session"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><style>  .flow text { fill: #1f2937; }
  .flow .fl-sub { opacity: .75; }
  .flow .fl-node { fill: #ffffff; stroke: #1f2937; stroke-opacity: .25; stroke-width: 1.2; }
  .flow .fl-in { fill: color-mix(in oklab, #0ea5e9 12%, #ffffff); }
  .flow .fl-out { fill: color-mix(in oklab, #374151 8%, #ffffff); }
  .flow .fl-main { fill: color-mix(in oklab, #16a34a 14%, #ffffff); stroke: #16a34a; stroke-opacity: .7; }
  .flow .fl-sugg { fill: color-mix(in oklab, #d97706 18%, #ffffff); stroke: #d97706; stroke-opacity: .9; }
  .flow .fl-decision { fill: #f3f4f6; stroke: #1f2937; stroke-opacity: .35; stroke-width: 1.2; }
  .flow .edge { stroke: #1f2937; stroke-opacity: .55; stroke-width: 1.5; fill: none; }
  .flow .arrowhead { fill: #1f2937; fill-opacity: .7; }
  .flow .edge-label { fill: #1f2937; }
</style><g id="f2-edit"><title>Agent edits a file</title><rect class="fl-node fl-in" x="10" y="30" width="120" height="56" rx="10"/><text x="70.0" y="54.5" text-anchor="middle" font-size="13" font-weight="700">Agent edits</text><text x="70.0" y="71.5" text-anchor="middle" font-size="11.5" class="fl-sub">a file</text></g><g id="f2-e1"><path class="edge" d="M130,58 L153,58" marker-end="url(#arr)"/></g><g id="f2-guard"><title>Guard asks you before ignores</title><rect class="fl-node" x="155" y="30" width="190" height="56" rx="10"/><text x="250.0" y="54.5" text-anchor="middle" font-size="13" font-weight="700">Guard</text><text x="250.0" y="71.5" text-anchor="middle" font-size="11.5" class="fl-sub">asks you before ignores</text></g><g id="f2-e2"><path class="edge" d="M345,58 L368,58" marker-end="url(#arr)"/></g><g id="f2-lint"><title>Lint the edited file errors on changed lines</title><rect class="fl-node" x="370" y="30" width="170" height="56" rx="10"/><text x="455.0" y="54.5" text-anchor="middle" font-size="13" font-weight="700">Lint the edited file</text><text x="455.0" y="71.5" text-anchor="middle" font-size="11.5" class="fl-sub">errors on changed lines</text></g><g id="f2-e3"><path class="edge" d="M540,58 L548,58" marker-end="url(#arr)"/></g><g id="f2-decide"><title>Rule broken?</title><polygon class="fl-decision" points="610,26.0 670.0,58 610,90.0 550.0,58"/><text x="610" y="55.0" text-anchor="middle" font-size="12.5" font-weight="700">Rule</text><text x="610" y="71.0" text-anchor="middle" font-size="12.5" font-weight="700">broken?</text></g><g id="f2-no"><path class="edge" d="M670,58 L698,58" marker-end="url(#arr)"/><text class="edge-label" x="684" y="50" text-anchor="middle" font-size="11.5" font-weight="700">no</text></g><g id="f2-silent"><title>Silent no tokens</title><rect class="fl-node fl-main" x="700" y="30" width="90" height="56" rx="10"/><text x="745.0" y="54.5" text-anchor="middle" font-size="13" font-weight="700">Silent</text><text x="745.0" y="71.5" text-anchor="middle" font-size="11.5" class="fl-sub">no tokens</text></g><g id="f2-yes"><path class="edge" d="M610,90 L610,128" marker-end="url(#arr)"/><text class="edge-label" x="622" y="114" text-anchor="start" font-size="11.5" font-weight="700">yes</text></g><g id="f2-msg"><title>Message with the fix goes back to the agent</title><rect class="fl-node fl-sugg" x="520" y="130" width="180" height="56" rx="10"/><text x="610.0" y="154.5" text-anchor="middle" font-size="13" font-weight="700">Message with the fix</text><text x="610.0" y="171.5" text-anchor="middle" font-size="11.5" class="fl-sub">goes back to the agent</text></g><g id="f2-back"><path class="edge" d="M520,158 L70,158 L70,88" marker-end="url(#arr)"/><text class="edge-label" x="300" y="150" text-anchor="middle" font-size="11.5" font-weight="700">fixed in the same turn</text></g><g id="f2-turn"><title>End of each turn full check of every file edited in the turn</title><rect class="fl-node" x="10" y="220" width="370" height="50" rx="10"/><text x="195.0" y="241.5" text-anchor="middle" font-size="13" font-weight="700">End of each turn</text><text x="195.0" y="258.5" text-anchor="middle" font-size="11.5" class="fl-sub">full check of every file edited in the turn</text></g><g id="f2-ci"><title>CI main config as the safety net, slow tools too</title><rect class="fl-node fl-out" x="410" y="220" width="380" height="50" rx="10"/><text x="600.0" y="241.5" text-anchor="middle" font-size="13" font-weight="700">CI</text><text x="600.0" y="258.5" text-anchor="middle" font-size="11.5" class="fl-sub">main config as the safety net, slow tools too</text></g></svg>