<svg xmlns="http://www.w3.org/2000/svg" class="flow" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 800 226" role="img" aria-label="How agent-rules-bench measures a study"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><style>  .flow text { fill: #1f2937; }
