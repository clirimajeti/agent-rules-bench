g><g id="f3-e5"><path class="edge" d="M740,76 L740,118" marker-end="url(#arr)"/></g><g id="f3-decide"><title>Rule broken?</title><polygon class="fl-decision" points="740,120.0 790.0,150 740,180.0 690.0,150"/><text x="740" y="147.0" text-anchor="middle" font-size="12.5" font-weight="700">Rule</text><text x="740" y="163.0" text-anchor="middle" font-size="12.5" font-weight="700">broken?</text></g><g id="f3-yes"><path class="edge" d="M690,150 L622,150" marker-end="url(#arr)"/><text class="edge-label" x="664" y="142" text-anchor="middle" font-size="11.5" font-weight="700">yes</text></g><g id="f3-fix"><title>One review fix same precise feedback</title><rect class="fl-node fl-sugg" x="470" y="122" width="150" height="56" rx="10"/><text x="545.0" y="146.5" text-anchor="middle" font-size="13" font-weight="700">One review fix</text><text x="545.0" y="163.5" text-anchor="middle" font-size="11.5" class="fl-sub">same precise feedback</text></g><g id="f3-e6"><path class="edge" d="M470,150 L402,150" marker-end="url(#arr)"/></g><g id="f3-no"><path class="edge" d="M740,180 L740,212 L330,212 L330,180" marker-end="url(#arr)"/><text class="edge-label" x="752" y="200" text-anchor="start" font-size="11.5" font-weight="700">no</text></g><g id="f3-result"><title>result.json breaks, cost, turns</title><rect class="fl-node" x="260" y="122" width="140" height="56" rx="10"/><text x="330.0" y="146.5" text-anchor="middle" font-size="13" font-weight="700">result.json</text><text x="330.0" y="163.5" text-anchor="middle" font-size="11.5" class="fl-sub">breaks, cost, turns</text></g><g id="f3-e7"><path class="edge" d="M260,150 L192,150" marker-end="url(#arr)"/></g><g id="f3-pool"><title>Summarize and pool bootstrap 95% intervals</title><rect class="fl-node fl-out" x="10" y="122" width="180" height="56" rx="10"/><text x="100.0" y="146.5" text-anchor="middle" font-size="13" font-weight="700">Summarize and pool</text><text x="100.0" y="163.5" text-anchor="middle" font-size="11.5" class="fl-sub">bootstrap 95% intervals</text></g></svg>